<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Blue Kargo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    body {
      color: #000;
      position: relative;
      font-family: "Inter", Helvetica, Arial, sans-serif;
    }

    nav {
      position: absolute;
      top: 32px;
      left: 32px;
      display: flex;
      align-items: flex-start;
      gap: 28px;
      z-index: 2;
    }

    nav a {
      color: #000;
      text-decoration: none;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    main {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 32px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    h1 {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(7px, 0.8vw, 12px);
      font-family: "Inter", Helvetica, Arial, sans-serif;
      font-size: clamp(56px, 8vw, 128px);
      font-weight: 600;
      line-height: 0.88;
      letter-spacing: 0;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 span {
      display: block;
      width: max-content;
      line-height: 0.88;
      letter-spacing: 0;
    }

    .description {
      margin: clamp(24px, 3vw, 40px) 0 0;
      max-width: 430px;
      font-size: 12px;
      font-weight: 300;
      line-height: 1.55;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <nav aria-label="Primary navigation">
    <a href="#about">about</a>
    <a href="#contact">contact</a>
    <a href="#you">you</a>
  </nav>

  <main>
    <section class="brand">
      <h1 aria-label="The Blue Kargo">
        <span>THE</span>
        <span>BLUE</span>
        <span>KARGO</span>
      </h1>
      <p class="description">The Blue Kargo was designed in the hands of creators who long to ensure the perfect workspace for those handling the busy job of pre-production in the cinema industry.</p>
    </section>
  </main>
</body>
</html>
