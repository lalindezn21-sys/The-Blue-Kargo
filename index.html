<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Blue Kargo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      color: #fff;
      position: relative;
      font-family: "Inter", Helvetica, Arial, sans-serif;
      background-image: url("./a607b88eb45c08918a823b622f8ab1f8.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.12);
      z-index: 0;
    }

    nav {
      position: absolute;
      top: 32px;
      left: 32px;
      display: flex;
      align-items: flex-start;
      gap: 28px;
      z-index: 2;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    main {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 52px;
      z-index: 1;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    h1 {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(10px, 1vw, 16px);
      font-family: "Inter", Helvetica, Arial, sans-serif;
      font-size: clamp(56px, 8vw, 128px);
      font-weight: 600;
      line-height: 0.88;
      letter-spacing: 0;
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 span {
      display: block;
      width: max-content;
      line-height: 0.88;
      letter-spacing: 0;
    }

    .description {
      margin: clamp(24px, 3vw, 40px) 0 0;
      width: min(320px, 70vw);
      font-size: 12px;
      font-weight: 300;
      line-height: 1.7;
      letter-spacing: 0.01em;
      color: #fff;
    }

    .read-more {
      display: inline-flex;
      align-items: center;
      margin-top: 22px;
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    .read-more .label {
      position: relative;
      display: inline-block;
      padding-bottom: 5px;
    }

    .read-more .label::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 1px;
      background: #fff;
      transform: scaleX(0);
      transform-origin: left center;
    }

    .read-more:hover .label::after,
    .read-more:focus-visible .label::after {
      animation: readMoreUnderline 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes readMoreUnderline {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <nav aria-label="Primary navigation">
    <a href="#about">about</a>
    <a href="#contact">contact</a>
    <a href="#you">you</a>
  </nav>

  <main>
    <section class="brand">
      <h1 aria-label="The Blue Kargo">
        <span>THE</span>
        <span>BLUE</span>
        <span>KARGO</span>
      </h1>
      <p class="description">The Blue Kargo was designed in the hands of creators who long to ensure the perfect workspace for those handling the busy job of pre-production in the cinema industry.</p>
      <a class="read-more" href="#about" aria-label="Read more about The Blue Kargo">
        <span class="label">read more</span>
      </a>
    </section>
  </main>
</body>
</html>
